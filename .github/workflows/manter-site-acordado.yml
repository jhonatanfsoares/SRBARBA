# Acessa o site a cada 10 minutos para o plano gratuito do Render não "dormir".
name: Manter site acordado

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acessar o site
        run: curl -fsS --max-time 120 --retry 3 --retry-delay 20 -o /dev/null -w "HTTP %{http_code}\n" https://srbarba.onrender.com/login
