<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Equipe')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('barbeiros')}"></nav>

<main class="container">
    <h1>Equipe</h1>
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="card">
        <h3>Novo barbeiro</h3>
        <form th:action="@{/admin/barbeiros}" method="post" class="inline-form">
            <div class="field" style="flex:2"><label for="nome">Nome</label><input id="nome" name="nome" required></div>
            <div class="field" style="flex:2"><label for="especialidade">Especialidade</label><input id="especialidade" name="especialidade"></div>
            <div class="field" style="flex:1"><label for="telefone">Telefone</label><input id="telefone" name="telefone"></div>
            <div class="field" style="flex:1"><label for="percentualComissao">Comissão (%)</label>
                <input id="percentualComissao" name="percentualComissao" type="number" min="0" max="100" step="1" value="40" required></div>
            <button class="btn" type="submit">Cadastrar</button>
        </form>
    </div>

    <div class="card">
        <table>
            <thead><tr><th>Nome</th><th>Especialidade</th><th>Telefone</th><th class="right">Comissão</th><th>Situação</th><th></th></tr></thead>
            <tbody>
            <tr th:each="b : ${barbeiros}">
                <td th:text="${b.nome}"></td>
                <td th:text="${b.especialidade}"></td>
                <td th:text="${b.telefone}"></td>
                <td class="right" th:text="${b.percentualComissao} + '%'"></td>
                <td><span class="badge" th:classappend="${b.ativo} ? 'badge-ativo' : 'badge-inativo'"
                          th:text="${b.ativo} ? 'Ativo' : 'Inativo'"></span></td>
                <td>
                    <form th:action="@{/admin/barbeiros/{id}/ativo(id=${b.id})}" method="post">
                        <button class="btn btn-sm btn-outline" type="submit" th:text="${b.ativo} ? 'Desativar' : 'Reativar'"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
